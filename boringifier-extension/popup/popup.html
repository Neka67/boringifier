<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">Boringifier</div>
  </header>
  
  <main>
    <div class="section">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIza..." spellcheck="false" autocomplete="off">
      <button id="saveKey" class="btn">Save Key</button>
      <p id="keyMsg" class="msg" hidden></p>
    </div>

    <div class="section" id="statsSection" hidden>
      <h3>Session Stats</h3>
      <p class="total" id="statsTotal">0 titles analysed</p>
      <button id="clearStats" class="btn btn-outline">Clear Stats</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
